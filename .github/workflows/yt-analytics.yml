name: 유튜브 스튜디오 지표

# 주간 수집(sns-collect.yml)에 이미 같은 단계가 들어 있다. 이 워크플로는 **수동 확인용** —
# 연동 직후 어느 채널에 권한이 있는지 보거나, 토큰을 새로 발급한 뒤 바로 검증할 때 쓴다.
# sns-collect를 통째로 돌리면 Apify 수집이 같이 돌아 회당 ~$3.5가 나가므로 분리했다.
#
# mode
#   dry-run  기본. 채널별 권한만 확인하고 파일은 저장하지 않음
#   collect  실제 수집 후 src/data/sns/ytAnalytics.js 커밋
#
# 로그에는 채널 키와 채널 ID만 남기고 실적 수치는 출력하지 않는다 (공개 저장소)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        type: choice
        options: [dry-run, collect]
        default: dry-run

permissions:
  contents: write

concurrency:
  group: yt-analytics
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 시크릿 값은 절대 출력하지 않는다. 길이와 형태만 보고 어느 칸이 어긋났는지 가른다
      - name: 시크릿 형태 점검
        env:
          YT_OAUTH_CLIENT_ID: ${{ secrets.YT_OAUTH_CLIENT_ID }}
          YT_OAUTH_CLIENT_SECRET: ${{ secrets.YT_OAUTH_CLIENT_SECRET }}
          YT_OAUTH_REFRESH_TOKEN: ${{ secrets.YT_OAUTH_REFRESH_TOKEN }}
        run: |
          fail=0
          case "$YT_OAUTH_CLIENT_ID" in
            *.apps.googleusercontent.com) echo "클라이언트 ID 형태 정상 (길이 ${#YT_OAUTH_CLIENT_ID})" ;;
            "") echo "클라이언트 ID 비어 있음"; fail=1 ;;
            *) echo "클라이언트 ID가 .apps.googleusercontent.com 으로 끝나지 않음 (길이 ${#YT_OAUTH_CLIENT_ID})"; fail=1 ;;
          esac
          case "$YT_OAUTH_CLIENT_SECRET" in
            GOCSPX-*) echo "클라이언트 보안 비밀 형태 정상 (길이 ${#YT_OAUTH_CLIENT_SECRET})" ;;
            "") echo "클라이언트 보안 비밀 비어 있음"; fail=1 ;;
            *) echo "클라이언트 보안 비밀이 GOCSPX- 로 시작하지 않음 (길이 ${#YT_OAUTH_CLIENT_SECRET})"; fail=1 ;;
          esac
          case "$YT_OAUTH_REFRESH_TOKEN" in
            "") echo "리프레시 토큰 비어 있음"; fail=1 ;;
            ya29.*) echo "리프레시 토큰 칸에 액세스 토큰이 들어 있음 (ya29 로 시작, 길이 ${#YT_OAUTH_REFRESH_TOKEN})"; fail=1 ;;
            1//*) echo "리프레시 토큰 형태 정상 (길이 ${#YT_OAUTH_REFRESH_TOKEN})" ;;
            *) echo "리프레시 토큰이 1// 로 시작하지 않음 (길이 ${#YT_OAUTH_REFRESH_TOKEN})"; fail=1 ;;
          esac
          case "$YT_OAUTH_REFRESH_TOKEN" in
            *[[:space:]]*|*'"'*|*,*) echo "리프레시 토큰에 공백이나 따옴표, 쉼표가 섞여 있음"; fail=1 ;;
          esac
          if [ "$fail" = "1" ]; then
            echo "docs/yt-analytics-setup.md 의 시크릿 등록 절차를 다시 확인할 것"
            exit 1
          fi
          echo "세 시크릿 형태 모두 정상"

          # 클라이언트 자격과 토큰 중 무엇이 잘못됐는지 가른다.
          # 일부러 틀린 토큰으로 교환을 시도하면 구글은 클라이언트 ID·보안 비밀이 틀렸을 때만
          # invalid_client을 준다. 여기서 invalid_grant이 나오면 클라이언트 쌍은 맞는 것이다
          probe=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d client_id="$YT_OAUTH_CLIENT_ID" \
            -d client_secret="$YT_OAUTH_CLIENT_SECRET" \
            -d refresh_token=probe-not-a-real-token \
            -d grant_type=refresh_token)
          case "$probe" in
            *invalid_client*)
              echo "클라이언트 ID와 보안 비밀 쌍이 구글에서 인정되지 않음"
              echo "두 값이 같은 클라이언트에서 나온 것인지, 클라이언트를 지우고 다시 만들지 않았는지 확인할 것" ;;
            *invalid_grant*)
              echo "클라이언트 ID와 보안 비밀 쌍은 정상"
              echo "다음 단계가 invalid_grant으로 실패하면 그때는 리프레시 토큰이 무효인 것" ;;
            *) echo "판별 응답을 해석하지 못함" ;;
          esac

      - name: 스튜디오 지표 수집
        env:
          YT_OAUTH_CLIENT_ID: ${{ secrets.YT_OAUTH_CLIENT_ID }}
          YT_OAUTH_CLIENT_SECRET: ${{ secrets.YT_OAUTH_CLIENT_SECRET }}
          YT_OAUTH_REFRESH_TOKEN: ${{ secrets.YT_OAUTH_REFRESH_TOKEN }}
        run: |
          if [ "${{ inputs.mode }}" = "collect" ]; then
            node scripts/sns/yt-analytics.mjs
          else
            node scripts/sns/yt-analytics.mjs --dry-run
          fi

      - name: 결과 커밋
        if: ${{ inputs.mode == 'collect' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/sns/ytAnalytics.js
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "유튜브 스튜디오 지표 갱신"
          git push
